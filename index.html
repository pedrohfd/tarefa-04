<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documento</title>
</head>

<body>
    <header></header>

    <main>
        <section>
            <h3>imagens</h3>
            <img src="assets/sonic.jpeg" alt="sonic" width="100" height="100" />
            <img src="assets/diamante.jpeg" alt="diamante" width="100" height="100" />
            <img src="assets/ichigo.jpg" alt="ichigo" width="100" height="100" />
        </section>

        <section>
            <h3>video</h3>
            <video src="assets/Michael-Jackson-Thriller.mp4" controls width="300" poster="assets/ichigo.jpg"></video>
        </section>

        <section>
            <h3>audio</h3>
            <audio controls>
                <source src="assets/Michael-Jackson-Thriller.mp3" type="audio/mpeg" />
                <source src="assets/Michael-Jackson-Thriller.ogg" type="audio/ogg" />
                Seu navegador não suporta áudio.
            </audio>
        </section>

        <section>
            <h3>contato</h3>
            <form>
                <div>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required />
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required />
                </div>

                <div>
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem"></textarea>
                </div>

                <button type="submit">Enviar</button>
            </form>
        </section>

        <section>
            <h3>links</h3>
            <a href="https://www.google.com.br/">Google</a>
            <a href="https://www.youtube.com/">
                <img src="assets/sonic.jpeg" alt="sonic" width="100" height="100" />
            </a>

            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">Nova aba</a>
        </section>

        <section>
            <h3>lista ordenada</h3>

            <ol>
                <li>Passo 1</li>
                <li>Passo 2</li>
                <li>Passo 3</li>
            </ol>
        </section>

        <section>
            <h3>lista não ordenada</h3>
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ul>
        </section>
    </main>

    <footer></footer>
</body>

</html>
